<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071A35">
  <title>You're offline | Vaishnavi Collections</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #071A35; color: #fff; font-family: Arial, sans-serif; text-align: center; }
    main { width: min(100%, 440px); }
    img { width: 92px; height: 92px; object-fit: contain; margin-bottom: 24px; }
    h1 { margin: 0 0 12px; color: #D4AF37; font-size: clamp(2rem, 8vw, 2.7rem); }
    p { margin: 0 auto 28px; color: #e2e8f0; line-height: 1.6; }
    button { border: 0; border-radius: 999px; padding: 13px 28px; background: #D4AF37; color: #071A35; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/vc-round-logo.png" alt="Vaishnavi Collections">
    <h1>You're offline</h1>
    <p>Please check your internet connection and try again.</p>
    <button type="button" onclick="window.location.reload()">Retry</button>
  </main>
</body>
</html>
